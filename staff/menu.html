<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>لوحة القائمة | أيامك يا شام</title>
  <link rel="stylesheet" href="../assets/css/staff.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/staff-supabase.js"></script>
  <script defer src="../assets/js/staff-app.js"></script>
</head>
<body data-staff-page="dashboard" data-staff-role="menu">

<main class="staff-shell">
  <header class="staff-topbar">
    <div><div class="staff-brand">أيامك يا شام</div><div class="staff-subtitle">لوحة القائمة — اقتراحات تحتاج موافقة المدير</div></div>
    <div class="staff-actions" style="margin:0">
      <span class="staff-pill" id="staff-role-label">القائمة</span>
      <span class="staff-small" id="staff-user-name"></span>
      <button id="staff-signout" class="staff-button secondary" type="button">تسجيل الخروج</button>
    </div>
  </header>
  <section class="staff-card">
    <h1>المنتجات</h1>
    <p class="staff-subtitle">يمكنك طلب تفعيل أو إيقاف منتج؛ لا يجري أي تعديل مباشر قبل موافقة المدير.</p>
    <div id="staff-message" class="staff-message hidden" role="status" aria-live="polite"></div>
    <div class="staff-toolbar"><button id="refresh-orders" class="staff-button secondary" type="button" onclick="location.reload()">تحديث القائمة</button></div>
    <div id="staff-products"><div class="staff-empty">جارٍ تحميل المنتجات…</div></div>
  </section>
</main>

</body>
</html>
