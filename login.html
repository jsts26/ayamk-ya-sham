<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دخول الإدارة — أيامك يا شام</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f2ec;color:#17212b;display:grid;place-items:center;min-height:100vh;padding:20px}.card{width:min(440px,100%);background:#fff;padding:28px;border-radius:18px;box-shadow:0 12px 36px #14202b18}h1{margin-top:0;font-size:24px}label{display:block;margin:14px 0 6px}input{width:100%;padding:12px;border:1px solid #d8dce0;border-radius:9px;font:inherit}button{width:100%;margin-top:18px;background:#173746;color:#fff;border:0;padding:13px;border-radius:9px;font:inherit;cursor:pointer}.msg{margin-top:14px;color:#9b3327;white-space:pre-wrap}.hint{color:#65717a;font-size:13px}
</style></head><body><main class="card"><h1>أيامك يا شام</h1><p>تسجيل دخول مدير المطعم</p><form id="login"><label for="email">البريد الإلكتروني</label><input id="email" type="email" required autocomplete="username"><label for="password">كلمة المرور</label><input id="password" type="password" required autocomplete="current-password"><button>تسجيل الدخول</button></form><div class="msg" id="msg" role="status"></div><p class="hint">تُدار صلاحية المدير من جدول admin_users في Supabase.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../assets/js/supabase.js"></script><script>
document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const msg=document.getElementById('msg');msg.textContent='جارٍ تسجيل الدخول…';const {data,error}=await supabaseClient.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){msg.textContent='تعذر تسجيل الدخول: '+error.message;return}location.href='./index.html';});
</script></body></html>
